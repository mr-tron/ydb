syntax = "proto2";

package NMvp.NMeta;

import "ydb/mvp/core/protos/mvp.proto";

message TMetaConfig {
    message TGrafanaConfig {
        // Grafana base URL used to resolve relative Grafana links.
        optional string Endpoint = 1;
    }

    message TSupportLinksConfig {
        message TSupportLinkEntry {
            message TRequestParamConfig {
                // Target parameter name in the generated link.
                optional string ForwardTo = 1;
                // Explicitly disable forwarding of this request parameter for the current entity/source entry.
                optional bool Forward = 2 [default = true];
            }

            message TRequestParamsConfig {
                // Optional override for request parameter "cluster".
                optional TRequestParamConfig Cluster = 1;
                // Optional override for request parameter "database".
                optional TRequestParamConfig Database = 2;
            }

            message TAdditionalParamConfig {
                // Target parameter name in the generated link.
                optional string Label = 1;
                // Cluster info column name used as the parameter value.
                optional string FromClusterInfo = 2;
                // Constant parameter value.
                optional string Value = 3;
            }

            // Link source identifier (for example: grafana/dashboard/search).
            optional string Source = 1;
            // Optional display name shown in UI.
            optional string Title = 2;
            // Source-specific URL. Can be absolute or relative, depending on source.
            optional string Url = 3;
            // Grafana search tag filters (for source=grafana/dashboard/search).
            repeated string Tag = 4;
            // Grafana folder UID filters (for source=grafana/dashboard/search).
            repeated string Folder = 5;
            // Optional request parameter forwarding overrides merged over source/entity defaults.
            // Omitted supported parameters keep their default behavior.
            optional TRequestParamsConfig RequestParams = 6;
            // Additional parameters appended by the source.
            // When specified, replace source defaults completely.
            repeated TAdditionalParamConfig AdditionalParams = 7;
        }
        // Support links resolved for cluster entity.
        repeated TSupportLinkEntry Cluster = 1;
        // Support links resolved for database entity.
        repeated TSupportLinkEntry Database = 2;
    }

    optional string MetaApiEndpoint = 1;
    optional string MetaDatabase = 2;
    optional bool MetaCache = 3 [default = false];
    optional string MetaDatabaseTokenName = 4;
    optional bool DbUserTokenAccess = 5 [default = false];
    // Grafana integration settings used by Grafana-based support link sources.
    optional TGrafanaConfig Grafana = 6;
    // Shared support links config reused across all clusters/databases.
    optional TSupportLinksConfig SupportLinks = 7;
}

message TMetaAppConfig {
    optional NMvp.TGenericConfig Generic = 1;
    optional TMetaConfig Meta = 2;
}
